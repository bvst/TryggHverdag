# SPIKE-01, iOS simulator: post the fixed alert, then refresh the app's list of
# delivered notifications, so a driver can read it from the screen. The flow
# only acts. Run with MAESTRO_CLI_NO_ANALYTICS=1 and
# MAESTRO_DISABLE_UPDATE_CHECK=true.
appId: org.example.spike.backgroundsafety
---
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element:
      id: alert-soon
- tapOn:
    id: alert-soon
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: .*SPIKE-01 alert.*
    timeout: 30000
- scrollUntilVisible:
    element:
      id: refresh-delivered
- tapOn:
    id: refresh-delivered
