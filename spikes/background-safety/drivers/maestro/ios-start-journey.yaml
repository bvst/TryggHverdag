# SPIKE-01, iOS simulator: start a journey in the spike app. The flow only
# acts; every verdict comes from the receiver's records and the analysis.
# Location and motion are granted beforehand with `simctl privacy`; the
# notification prompt has no simctl grant, so the flow accepts it here.
# Run with MAESTRO_CLI_NO_ANALYTICS=1 and MAESTRO_DISABLE_UPDATE_CHECK=true.
appId: org.example.spike.backgroundsafety
---
- launchApp
- tapOn:
    id: start-journey
# KNOWN PROBLEM, cause not established (2026-09-30, build 39a638d6, twice):
# after this tap, the app's "Post the alert in 10 s" button, which then sits
# under the prompt's Allow button, was pressed too, and the S5 alert was
# scheduled. Turning off Maestro's retryTapIfNoChange made no difference.
# Until this is fixed, any run using this flow must check the app's event list
# for "alert scheduled" and clear delivered notifications before S2 or S5.
- tapOn:
    text: Allow
    optional: true
