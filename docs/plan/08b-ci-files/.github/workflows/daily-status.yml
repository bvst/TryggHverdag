# D-050: daily status report for the owner, posted to the pinned "Daily status" issue.
name: daily-status
on:
  schedule:
    - cron: '0 5 * * *'     # 07:00 Oslo (summer) / 06:00 (winter)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Input names follow the Claude Code GitHub Action v1 docs; verify at setup.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the /status skill for the last 24 hours.
            Post the report as a comment on the open issue titled "Daily status" (create and pin it if missing).
            Keep it to one phone screen. Start with ✅ healthy, ⚠️ needs attention, or 🛑 action required.
