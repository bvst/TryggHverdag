# Required checks on every pull request (Section 8, CI-01 to CI-10).
#
# Every job runs a repository script, so CI runs exactly what a session runs
# locally. The list of jobs here is not free-form: scripts/lib/merge-rules.mjs
# holds the one list of checks, and the gate-integrity job fails if this file,
# that list and the repository's own merge rules ever stop agreeing.
#
# A check whose script does not exist yet has no job here: it is absent rather
# than skipped, because a skipped job reports as a green tick, and a green tick
# for work nobody did is the one thing this repository must not produce.
# gate-integrity lists such checks every run, and starts failing the day their
# script exists but the job still does not. Today every check has its job.
#
# Actions are pinned to a commit, never a tag: whoever can move a tag can
# otherwise run their own code in a job that holds this repository's secrets.
# Dependabot raises the pins (.github/dependabot.yml).
#
# Every job names its Ubuntu release, ubuntu-26.04, never ubuntu-latest. GitHub
# moves that label to a new release over weeks, so for a while some runs would
# get the old release and some the new, and a red that comes and goes would
# look like a flaky test. Moving to a new release is a pull request of its own,
# whose CI shows whether every job still works (D-085). Dependabot cannot see
# the label, so it is raised by hand. The label names the release, not one
# build: GitHub still updates the image under it. When a red comes and goes,
# compare the Image Version that each job's "Set up job" step prints.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# oasdiff, which api:diff runs to compare the API with every released app
# version (D-030). Pinned the way gitleaks is in the security job: a version,
# and the SHA-256 its release publishes for the archive in checksums.txt,
# checked before anything is unpacked. Written here once, because two jobs
# install it: unit, where the CI-06 gate drill runs (INF-10), and contract,
# where the gate runs. Dependabot cannot see this pin, so it is raised by hand,
# both lines together (D-082). Apache-2.0.
env:
  OASDIFF_VERSION: '1.32.1'
  OASDIFF_SHA256: '7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f'

jobs:
  gate-integrity: # CI-01: the merge rules are real (D-029), CODEOWNERS is complete (D-042)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gate:integrity
        env:
          # The branch's rules are readable with ordinary repository access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Who may bypass them is a repository setting, and needs its own
          # read-only token. Without it this job fails on purpose: "nobody
          # checked" is not the same answer as "nobody can bypass" (D-029).
          RULES_READ_TOKEN: ${{ secrets.RULES_READ_TOKEN }}
      - run: pnpm run test:hooks

  static: # CI-02 (L1)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # CI-12. Not a paths: filter and not a job-level if:, because either
      # would leave this required check skipped — and a skipped job reports as
      # a green tick, which the header above calls the one thing this
      # repository must not produce. Worse, a required check that never
      # reports deadlocks the pull request outright.
      #
      # So the job runs, asks, and either works or says it had nothing to
      # check. `mutation` has worked this way since INF-04. Kept inside each
      # job rather than in a shared one: a shared job would itself have to be a
      # required check, and a job nothing requires can fail without stopping
      # anything (gate:integrity says so, and it is right).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.code != 'true'
        run: |
          echo "Every changed file is documentation or reviewer memory."
          echo "static has nothing to check on this diff (CI-12)."
      - if: steps.affected.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run gate:static

  unit: # CI-03 (L2, L5)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # No token is left in .git/config for the steps after: a downloaded
      # binary, oasdiff, runs in this job, and nothing here fetches (INF-10).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # CI-12. Not a paths: filter and not a job-level if:, because either
      # would leave this required check skipped — and a skipped job reports as
      # a green tick, which the header above calls the one thing this
      # repository must not produce. Worse, a required check that never
      # reports deadlocks the pull request outright.
      #
      # So the job runs, asks, and either works or says it had nothing to
      # check. `mutation` has worked this way since INF-04. Kept inside each
      # job rather than in a shared one: a shared job would itself have to be a
      # required check, and a job nothing requires can fail without stopping
      # anything (gate:integrity says so, and it is right).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.code != 'true'
        run: |
          echo "Every changed file is documentation or reviewer memory."
          echo "unit has nothing to check on this diff (CI-12)."
      - if: steps.affected.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # oasdiff, for the CI-06 gate drill that test:unit runs (INF-10). The
      # drill shows api:diff finding a breaking change, so in CI it fails when
      # there is no oasdiff to find one with. Installed as gitleaks is in the
      # security job: the release archive is checked against the pin in the
      # workflow env before anything is unpacked, and oasdiff is then put on
      # PATH for the steps after.
      - name: Install oasdiff, pinned and checked
        if: steps.affected.outputs.code == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/oasdiff/oasdiff" --version
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run test:unit

  integration: # CI-04 (L3) — a real PostgreSQL in a container, via Testcontainers
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # CI-12. Not a paths: filter and not a job-level if:, because either
      # would leave this required check skipped — and a skipped job reports as
      # a green tick, which the header above calls the one thing this
      # repository must not produce. Worse, a required check that never
      # reports deadlocks the pull request outright.
      #
      # So the job runs, asks, and either works or says it had nothing to
      # check. `mutation` has worked this way since INF-04. Kept inside each
      # job rather than in a shared one: a shared job would itself have to be a
      # required check, and a job nothing requires can fail without stopping
      # anything (gate:integrity says so, and it is right).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.code != 'true'
        run: |
          echo "Every changed file is documentation or reviewer memory."
          echo "integration has nothing to check on this diff (CI-12)."
      - if: steps.affected.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Docker is present on the GitHub runners, which is what makes this the
      # only place these tests can run today: a cloud session has the docker
      # binary but no daemon. Nothing is mocked here on purpose — the upsert,
      # the timestamp round trip and the database clock either work against
      # PostgreSQL or they do not.
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run test:integration

  system: # CI-05 (L6) — whole flows through the real API, fakes at the edges
    runs-on: ubuntu-26.04
    # The suite runs in about a second, so this is not a budget — it is a bound
    # on a hang. These tests drive the API in-process against a clock the test
    # moves by hand, and a bug that leaves one awaiting a promise nothing
    # resolves would otherwise sit at the runner's own six-hour ceiling.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # CI-12. Not a paths: filter and not a job-level if:, because either
      # would leave this required check skipped — and a skipped job reports as
      # a green tick, which the header above calls the one thing this
      # repository must not produce. Worse, a required check that never
      # reports deadlocks the pull request outright.
      #
      # So the job runs, asks, and either works or says it had nothing to
      # check. `mutation` has worked this way since INF-04. Kept inside each
      # job rather than in a shared one: a shared job would itself have to be a
      # required check, and a job nothing requires can fail without stopping
      # anything (gate:integrity says so, and it is right).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.code != 'true'
        run: |
          echo "Every changed file is documentation or reviewer memory."
          echo "system has nothing to check on this diff (CI-12)."
      - if: steps.affected.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run test:system

  contract: # CI-06 (L4, RG-08) — the API against every app version still in use
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # No token is left in .git/config for the steps after: a downloaded
      # binary, oasdiff, runs in this job, and nothing here fetches (INF-10).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # CI-12. Not a paths: filter and not a job-level if:, because either
      # would leave this required check skipped — and a skipped job reports as
      # a green tick, which the header above calls the one thing this
      # repository must not produce. Worse, a required check that never
      # reports deadlocks the pull request outright.
      #
      # So the job runs, asks, and either works or says it had nothing to
      # check. `mutation` has worked this way since INF-04. Kept inside each
      # job rather than in a shared one: a shared job would itself have to be a
      # required check, and a job nothing requires can fail without stopping
      # anything (gate:integrity says so, and it is right).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.code != 'true'
        run: |
          echo "Every changed file is documentation or reviewer memory."
          echo "contract has nothing to check on this diff (CI-12)."
      - if: steps.affected.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # The same oasdiff install as in unit, from the same pin (D-082): api:diff
      # compares the API with every released version through it.
      - name: Install oasdiff, pinned and checked
        if: steps.affected.outputs.code == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/oasdiff/oasdiff" --version
      # There are no released versions yet, so this reports that and passes.
      # From the first release on, it compares each one with the current API
      # through the oasdiff installed above, and fails on a breaking change
      # (D-030).
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run api:diff

  traceability: # CI-07 — RG-01 requirement coverage, RG-03 test changes, RG-04 coverage ratchet
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run req:coverage --fail-on-uncovered-changed
      - name: The committed requirement report still matches the tests
        # req:coverage rewrites docs/requirements-status.md. If the committed
        # copy differs, the report people read is out of date — which is how a
        # requirement comes to look covered when it is not.
        run: |
          git diff --exit-code docs/requirements-status.md || {
            echo "::error file=docs/requirements-status.md::Out of date. Run 'pnpm run req:coverage' and commit the result."
            exit 1
          }
      - run: pnpm run tests:changes --base origin/${{ github.base_ref || 'main' }}
      # The ratchet reads coverage/coverage-summary.json, and each job starts on
      # a clean runner, so this job measures its own rather than reaching for
      # what the unit job produced. It refuses to pass on missing numbers, so
      # leaving this out would turn CI-07 red rather than quietly unmeasured.
      # test:coverage, not test:unit --coverage: the baseline was recorded from
      # unit and system tests together (vitest.coverage.config.mjs says why).
      # Coverage cannot move when no code moved, and measuring it means
      # running the whole unit and system suite. Everything above still
      # runs on every diff: requirement IDs live in docs/plan, so a
      # documentation change can add or remove one (CI-12).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run test:coverage
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run coverage:ratchet --base origin/${{ github.base_ref || 'main' }}

  mutation: # CI-08 (RG-05, D-036) — only when safety code changed; fails if it changed and Stryker is missing
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # CI-12. Not a paths: filter and not a job-level if:, because either
      # would leave this required check skipped — and a skipped job reports as
      # a green tick, which the header above calls the one thing this
      # repository must not produce. Worse, a required check that never
      # reports deadlocks the pull request outright.
      #
      # So the job runs, asks, and either works or says it had nothing to
      # check. `mutation` has worked this way since INF-04. Kept inside each
      # job rather than in a shared one: a shared job would itself have to be a
      # required check, and a job nothing requires can fail without stopping
      # anything (gate:integrity says so, and it is right).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.code != 'true'
        run: |
          echo "Every changed file is documentation or reviewer memory."
          echo "mutation has nothing to check on this diff (CI-12)."
      - if: steps.affected.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.affected.outputs.code == 'true'
        run: >-
          pnpm run mutation
          --incremental --only-if-safety-paths-changed
          --base origin/${{ github.base_ref || 'main' }}

  android-e2e: # CI-09 (L7) — the release build on an Android emulator, driven by Maestro
    runs-on: ubuntu-26.04
    # The first measured runs set this for good (docs/specs/INF-06.md, CI cost).
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Nothing leaves for a tooling vendor that does not have to. Maestro reads
      # the update check with Boolean.parseBoolean, so only 'true' turns it
      # off; '1' would leave it sending a persistent ID (D-081).
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DISABLE_UPDATE_CHECK: 'true'
      # The emulator, written once. Both emulator steps and the snapshot's
      # cache key read these, so a changed setting also changes the key and a
      # snapshot is never restored under a key that no longer says what it
      # holds. The same image as the Mac's emulator: Android 17 with 16 KB
      # memory pages, which Google Play requires apps to work on.
      #
      # One API level, for both the platform and the system image: the action
      # installs platforms;android-<level> and, with no system-image-api-level,
      # builds the image's package name from the same level. It is major.minor
      # because API levels gained minor versions: Google's index has
      # platforms;android-37.0 to 37.2 and no android-37, which is what a bare
      # '37' asked for on the first run.
      EMULATOR_API_LEVEL: '37.2'
      EMULATOR_TARGET: google_apis_ps16k
      EMULATOR_ARCH: x86_64
      EMULATOR_PROFILE: pixel_8
      EMULATOR_LOCALE: nb-NO
      # The emulator's cores (BUG-6). Unset, the pinned action gives it 2, and
      # every run's emulator warned "AVD 'test' will run more smoothly with 4
      # CPU cores (currently using 2)"; run 36418631362's System UI then stopped
      # responding over the app. No more than the runner has CPUs: a public
      # repository's standard Linux runner has 4, a private one's 2, so this
      # drops to 2 if the repository goes private again.
      EMULATOR_CORES: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # CI-12, as in every job above, with its own question: can this diff
      # change the app? `app` is worked out from the files themselves
      # (scripts/lib/affected.mjs, touchesApp), and is always true on a push to
      # main, which is the backstop for a wrong "no" on a pull request.
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.app != 'true'
        run: |
          echo "Nothing in this diff can change the app or how it is tested."
          echo "android-e2e has nothing to check on this diff (CI-12)."
      # Without KVM the emulator runs in software, five to ten times slower, and
      # times out looking like a flaky test. So it is checked first, before
      # anything is paid for, and its absence stops the job with a reason.
      - name: Enable KVM, and stop if it cannot be used
        if: steps.affected.outputs.app == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          # Without --settle, trigger only queues the change and returns, so the
          # check below could run before udev has applied the rule.
          sudo udevadm trigger --name-match=kvm --settle
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            if [ -e /dev/kvm ]; then
              ls -l /dev/kvm
            else
              echo "/dev/kvm does not exist on this runner."
            fi
            echo "::error::/dev/kvm is not usable on this runner, so the emulator would run without hardware acceleration and time out. android-e2e stops here rather than report a slow emulator as a broken app."
            exit 1
          fi
      # Run 36303366850 stopped in the emulator step with "No device found
      # matching --device pixel_8": the runner image ships the command-line
      # tools 12.0, whose avdmanager has no Pixel 8. The pinned emulator action
      # installs its own tools only when $ANDROID_HOME/cmdline-tools is missing,
      # and runs whatever is in cmdline-tools/latest. So this puts 20.0 there,
      # the same archive the action pins for a runner without tools
      # (src/sdk-installer.ts), checked against its SHA-256 before anything is
      # unpacked. Nothing but cmdline-tools/latest is replaced, and no sudo is
      # needed: runner-images' install-android-sdk.sh ends with
      # `chmod -R a+rwx` on the SDK. The version is read from what is now in
      # latest, so a red emulator step can be read against it.
      - name: Install the pinned Android command-line tools in cmdline-tools/latest
        if: steps.affected.outputs.app == 'true'
        env:
          CMDLINE_TOOLS_ARCHIVE: 'commandlinetools-linux-14742923_latest.zip'
          CMDLINE_TOOLS_SHA256: '04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          archive="$tmp/$CMDLINE_TOOLS_ARCHIVE"
          curl -fsSL -o "$archive" "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ARCHIVE}"
          echo "${CMDLINE_TOOLS_SHA256}  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$tmp/unpacked"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$tmp/unpacked/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          grep '^Pkg.Revision=' "$ANDROID_HOME/cmdline-tools/latest/source.properties"
      # Run 36300860646 built the app and then stopped in the emulator's SDK
      # install with "No space left on device" while unpacking the system
      # image. These are toolchains this job never uses: .NET, Haskell (both
      # places it is installed), Swift and CodeQL. Removed before the build, so
      # the build has the room too. The Android SDK, Java, Node, ~/.gradle and
      # node_modules are not touched here or anywhere in this job.
      - name: Free disk space by removing toolchains this job never uses
        if: steps.affected.outputs.app == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            "$RUNNER_TOOL_CACHE/CodeQL"
      - if: steps.affected.outputs.app == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.app == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.app == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.affected.outputs.app == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: '17' }
      # The Gradle cache comes from actions/cache (MIT), not gradle/actions:
      # setup-gradle now bundles a proprietary caching component, and a
      # proprietary licence is not on the allowed list (the gitleaks-action
      # decision in the security job below). Restored on every run, saved from
      # main only, so pull-request branches cannot fill the cache.
      - id: gradle-cache
        if: steps.affected.outputs.app == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: gradle-${{ runner.os }}-
      # Built before the emulator boots: on a two-core runner, Gradle and an
      # emulator running at once starve each other, and a slow build turns into
      # a flaky test.
      - name: Build the release app for x86_64
        if: steps.affected.outputs.app == 'true'
        timeout-minutes: 30
        run: pnpm run e2e:android --build-only
      # What the build leaves that nothing after it reads. Gradle's daemon is
      # stopped first: a file it still holds open keeps its space after it is
      # deleted. The APK is in app/build/outputs, which stays, and so does
      # ~/.gradle, which main saves after the flows; the flow step installs the
      # APK already built and runs no Gradle. The free space is printed last,
      # so a disk that is still too full shows here, not as a failed SDK
      # install in the emulator step. The runner's CPUs and memory are printed
      # too (BUG-6): run 36418631362's log did not say which machine it had, a
      # public repository's 4 CPUs and 16 GB or a private one's 2 and 8, so its
      # red could not be read against them.
      - name: Free the build's disk space for the emulator, and show what is left, the CPUs and the memory
        if: steps.affected.outputs.app == 'true'
        run: |
          (cd apps/mobile/android && ./gradlew --stop)
          rm -rf apps/mobile/android/app/build/intermediates apps/mobile/android/app/.cxx
          df -h /
          echo "CPUs: $(nproc)"
          free -h
      - id: avd-cache
        if: steps.affected.outputs.app == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}-${{ env.EMULATOR_LOCALE }}-${{ env.EMULATOR_CORES }}cores
      # On main, with no cached device yet: boot once to make a clean snapshot
      # for later runs to start from. Pull requests only ever read it.
      - name: Create the virtual device and its snapshot
        if: steps.affected.outputs.app == 'true' && github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          cores: ${{ env.EMULATOR_CORES }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -change-locale ${{ env.EMULATOR_LOCALE }}
          disable-animations: false
          script: echo "Created the virtual device and saved a clean snapshot."
      - if: steps.affected.outputs.app == 'true' && github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # The key the restore above resolved, so it is written once.
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
      # On the job's 16 KB-page image, a native library that is not aligned for
      # those pages fails here, not at store upload.
      - name: Boot the emulator in bokmål and run every flow
        if: steps.affected.outputs.app == 'true'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          cores: ${{ env.EMULATOR_CORES }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -change-locale ${{ env.EMULATOR_LOCALE }}
          disable-animations: true
          script: pnpm run e2e:android --skip-build
      # Maestro's screenshots and logs show only synthetic screens (RG-07), and
      # are kept for 7 days: artefacts count against the account's storage.
      - name: Keep Maestro's debug output when a flow failed
        if: failure() && steps.affected.outputs.app == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-e2e-debug
          path: reports/e2e-android/
          retention-days: 7
      - if: steps.affected.outputs.app == 'true' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # The key the restore resolved: hashFiles() and runner.os cannot be
          # job env, so the restore step is where it is written, once.
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  security: # CI-10
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # CI-12. Not a paths: filter and not a job-level if:, because either
      # would leave this required check skipped — and a skipped job reports as
      # a green tick, which the header above calls the one thing this
      # repository must not produce. Worse, a required check that never
      # reports deadlocks the pull request outright.
      #
      # So the job runs, asks, and either works or says it had nothing to
      # check. `mutation` has worked this way since INF-04. Kept inside each
      # job rather than in a shared one: a shared job would itself have to be a
      # required check, and a job nothing requires can fail without stopping
      # anything (gate:integrity says so, and it is right).
      - id: affected
        run: node scripts/affected.mjs --base origin/${{ github.base_ref || 'main' }}
      - name: Nothing for this gate to check
        if: steps.affected.outputs.code != 'true'
        run: |
          echo "Every changed file is documentation or reviewer memory."
          echo "security has nothing to check on this diff (CI-12)."
      - if: steps.affected.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.affected.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.affected.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.affected.outputs.code == 'true'
        run: pnpm audit --audit-level high
      - if: steps.affected.outputs.code == 'true'
        run: pnpm run licenses:check
      # The gitleaks CLI (MIT), not gitleaks-action: the action is under a
      # proprietary end-user licence that is not on the allowed list in
      # scripts/lib/licenses.mjs, and it requires a key once a repository is
      # owned by an organisation — which is where this one is headed (D-029).
      # Pinned by version and checked against its published checksum, for the
      # same reason the actions are pinned by commit.
      #
      # Deliberately NOT guarded by CI-12, unlike the audit and licence steps
      # above: a secret leaks just as well through prose as through code, and a
      # documentation-only diff is exactly where someone pastes a token into an
      # example. It is also the one step in this job that needs no install.
      #
      # Honest footnote: it came out unguarded by accident — the edit that
      # added the guards matched `- run:` steps and this one starts with
      # `- name:`. A reviewer read it as a considered split. It is the right
      # behaviour, so it stays, but it is written down now rather than left as
      # luck that the next edit could undo.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --log-opts="--no-merges"
