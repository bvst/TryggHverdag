# GRP-01-AC26 and AC28 (L7): the first admin joins with the job's synthetic
# bootstrap code and sees the admin's choices; then creates an invitation, and
# its code shows, in four groups of five, with a share action.
#
# This flow needs the server CI's android-e2e job starts before the flows: a
# freshly migrated PostgreSQL, so no group exists yet, and the API with
# ADMIN_BOOTSTRAP_CODE set to the job's own synthetic value, which reaches the
# flow as BOOTSTRAP_CODE. The bootstrap code opens only an empty group, so this
# flow can pass once per database: the job's database is made for the run.
#
# Nothing a reader sees is written here: scripts/e2e-android.mjs passes every
# string in with -e, read from nb.json, and the code from the job.
#   APP_ID             the Android application ID
#   BOOTSTRAP_CODE     the API's ADMIN_BOOTSTRAP_CODE, synthetic, the job's
#   JOIN_TITLE         grp.join.title
#   CODE_LABEL         grp.join.codeLabel, the code field's screen-reader label
#   NAME_LABEL         grp.join.nameLabel, the name field's
#   JOIN_SUBMIT        grp.join.submit
#   MEMBER_TITLE       grp.member.title
#   INVITE_BUTTON      grp.member.invite
#   MEMBERS_BUTTON     grp.member.members
#   CREATE_INVITATION  grp.invite.create
#   SHARE_BUTTON       grp.invite.share
# The name typed is synthetic (RG-07).
#
# Never add `retry:` or `optional: true` to a step here (see app-starts.yaml).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ${JOIN_TITLE}
    timeout: 30000
- tapOn: ${CODE_LABEL}
- inputText: ${BOOTSTRAP_CODE}
- tapOn: ${NAME_LABEL}
- inputText: 'Testadmin Emulator'
- hideKeyboard
- tapOn: ${JOIN_SUBMIT}
# The join and then GET /v1/me go to the job's API, on the emulator's host.
- extendedWaitUntil:
    visible: ${MEMBER_TITLE}
    timeout: 30000
- assertVisible: ${MEMBER_TITLE}
- assertVisible: ${INVITE_BUTTON}
- assertVisible: ${MEMBERS_BUTTON}
- tapOn: ${INVITE_BUTTON}
- extendedWaitUntil:
    visible: ${CREATE_INVITATION}
    timeout: 15000
- tapOn: ${CREATE_INVITATION}
# Twenty of Crockford's base32 characters, in four groups of five.
- extendedWaitUntil:
    visible: '.*[0-9A-HJKMNP-TV-Z]{5}[- ][0-9A-HJKMNP-TV-Z]{5}[- ][0-9A-HJKMNP-TV-Z]{5}[- ][0-9A-HJKMNP-TV-Z]{5}.*'
    timeout: 15000
- assertVisible: ${SHARE_BUTTON}
- assertNotVisible: '[a-z][a-zA-Z0-9]*(\.[a-zA-Z0-9]+)+'
