# CALL-01-AC8 and CALL-02-AC2 (L7): at the largest font size the emulator
# image's Settings offer, the call button, with its text "Ring {name}", and the
# 112 button are both visible on the home screen without scrolling.
#
# NEVER TAP ANYTHING IN THE DIALER. This flow taps nothing at all: it only
# reads the home screen.
#
# Tagged `scripted` (CALL-01, approach 9): scripts/e2e-android.mjs runs it on
# its own, one `maestro test` for this flow alone, in the order the script
# holds, with the script's steps around it:
#   - it needs #1 chosen, with a short synthetic name (first-contact.yaml),
#     and the app signed in, so it runs before emergency-112.yaml;
#   - before it, the script sets the font size to the largest the image's
#     Settings offer (`adb shell settings put system font_scale <largest>`),
#     printing the value in the job log, and reads Telecom's record as the
#     baseline; the script resets the font size before the next flow, and at
#     the end of the run, even after a failure;
#   - after it, the script reads Telecom's record again, which must show no
#     new call: this flow taps nothing;
#   - assertVisible never scrolls, so a button pushed below the screen fails.
#   APP_ID           the Android application ID
#   CALL_BUTTON      call.button.call, filled with #1's synthetic name
#   EMERGENCY_LABEL  call.emergency.label
#
# Never add `retry:` or `optional: true` to a step here (see app-starts.yaml).
appId: ${APP_ID}
tags:
  - scripted
---
- launchApp:
    permissions:
      phone: allow
- extendedWaitUntil:
    visible: ${CALL_BUTTON}
    timeout: 30000
- assertVisible: ${CALL_BUTTON}
- assertVisible: ${EMERGENCY_LABEL}
