# CALL-02-AC3 and CALL-01-AC4 (L7): back from the phone's dialer, to the app,
# with 112 on screen again.
#
# NEVER TAP ANYTHING IN THE DIALER. This flow starts with the dialer in front,
# left there by emergency-112.yaml or call-without-permission.yaml, and leaves
# it by Android's back key alone: no tap, no input, no swipe, and never the
# dialer's call button (SPIKE-01-AC10's rule; CALL-02, "The L7 112 step").
#
# Tagged `scripted` (CALL-01, approach 9): scripts/e2e-android.mjs runs it on
# its own, one `maestro test` for this flow alone, in the order the script
# holds, with the script's steps around it:
#   - it runs right after a flow that leaves the dialer in front
#     (emergency-112.yaml or call-without-permission.yaml), once the script
#     has read the focused window and Telecom's record after that flow;
#   - before it, the script sets the phone's usual font size and reads
#     Telecom's record as the baseline. It changes no permission here: a
#     revoke stops the app's process, behind the dialer;
#   - it does not launch the app: it returns to it;
#   - after it, the script reads Telecom's record again, which must show no
#     new call.
#
# Back is pressed until the app's 112 button shows, three times at most: one
# press closes the dialpad, and a dialer that opened its own main screen under
# it needs one more.
#   APP_ID            the Android application ID
#   EMERGENCY_LABEL   call.emergency.label
#
# Never add `retry:` or `optional: true` to a step here (see app-starts.yaml).
appId: ${APP_ID}
tags:
  - scripted
---
- repeat:
    times: 3
    while:
      notVisible: ${EMERGENCY_LABEL}
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible: ${EMERGENCY_LABEL}
    timeout: 15000
- assertVisible: ${EMERGENCY_LABEL}
